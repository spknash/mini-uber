name: Run Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Run Python Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
      # 1️⃣  Code checkout
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣  Re‑usable UTC timestamp
      - name: Capture current timestamp
        id: timestamp
        run: echo "timestamp=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"

      # 3️⃣  Python tool‑chain
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: pip       # ✅ correct syntax

      # 4️⃣  Dependencies
      - name: Install Python dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest==7.4.3 pytest-json-report==1.5.0 requests==2.31.0 jq curl

      # 5️⃣  Run tests & build report
      - name: Run Python tests
        env:
          TIMESTAMP: ${{ steps.timestamp.outputs.timestamp }}
        run: |
          set -euo pipefail

          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"
          mkdir -p test_output

          echo "Running pytest..."
          pytest tests/ \
            --json-report \
            --json-report-file=test_output/report.json \
            -v 2>&1 | tee test_output/test_output.txt || true

          echo "Post‑processing results…"
          python3 <<'PY'
import json, os, datetime, pathlib, sys, textwrap
ts = os.environ.get("TIMESTAMP", datetime.datetime.utcnow().strftime("%Y-%m-%dT%H:%M:%SZ"))
out = pathlib.Path("test_output")
rep = out / "report.json"
results = []

def split_node(nodeid):
    parts = nodeid.split("::", 1)[0].split("/")
    mod  = parts[1] if len(parts) > 1 else "unknown"
    cat  = parts[2] if len(parts) > 2 else "unknown"
    return mod, cat

if rep.exists():
    data = json.loads(rep.read_text())
    for t in data.get("tests", []):
        mod, cat = split_node(t["nodeid"])
        results.append({
            "module": mod,
            "category": cat,
            "test_name": t["nodeid"].split("::")[-1],
            "status": t["outcome"],
            "output": t.get("call", {}).get("longrepr", "No detailed output"),
            "attempted_at": ts,
            "completed_at": ts
        })
else:
    results.append({
        "module": "unknown",
        "category": "unknown",
        "test_name": "No tests found",
        "status": "not_attempted",
        "output": "pytest produced no JSON report",
        "attempted_at": ts,
        "completed_at": ts
    })

(out / "test_results.json").write_text(json.dumps(results, indent=2))
print(json.dumps(results, indent=2))
PY

      # 6️⃣  Upload to Supabase
      - name: Upload results to Supabase
        run: |
          set -euo pipefail

          # Validate JSON first
          jq empty test_output/test_results.json

          json_payload=$(jq -n \
            --arg id "4600c943-a7f9-4efc-ad50-615921f9bf00" \
            --slurpfile tests test_output/test_results.json \
            '{id: $id, tests_status: $tests[0]}')

          response=$(curl -s -w "\n%{http_code}" -X POST \
            'https://xqfwqvbfjhxwqgrdcjck.supabase.co/rest/v1/user_projects' \
            -H "apikey: <redacted>" \
            -H "Authorization: Bearer <redacted>" \
            -H "Content-Type: application/json" \
            -H "Prefer: return=minimal" \
            --data "$json_payload")

          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')

          if [[ "$http_code" != "200" && "$http_code" != "201" ]]; then
            echo "Upload failed (HTTP $http_code): $body"
            exit 1
          fi

      # 7️⃣  Always print a summary
      - name: Notify completion
        if: always()
        run: |
          echo "Test run finished and results uploaded."
          if [ -f test_output/test_output.txt ]; then
            echo "–– Pytest output ––"
            cat test_output/test_output.txt
          fi
